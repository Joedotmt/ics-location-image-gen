<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICS Location Image Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
        body {
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: min(5em, 3vw);
            background-color: #0d1117;
        }

        .container {
            text-align: center;
            color: white;
            background-color: #384251;
            padding: min(2rem, 3vw);
            border-radius: 8px;
            max-width: 750px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        #fileInput,
        #dateInput {
            margin-bottom: 1rem;
        }

        button,
        ::-webkit-file-upload-button {
            border-radius: 99em;
            background-color: #697382;
            box-shadow: 0 4px 7px 0 rgba(0, 0, 0, 0.348);
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.075, 0.82, 0.165, 1);
            font-family: inherit;
            position: relative;
        }

        button:hover,
        ::-webkit-file-upload-button:hover {
            box-shadow: 0 5px 15px 0 rgba(0, 0, 0, 0.348), inset 0 0 0 2px #ffffff;
        }

        button:active,
        ::-webkit-file-upload-button:active {
            box-shadow: 0 5px 15px 0 rgba(0, 0, 0, 0.348);
            scale: 0.98;
        }

        ::-webkit-file-upload-button {
            margin-right: 1em;
        }

        input {
            background-color: #384251;
            border: 1px solid black;
            color: white;
            border-radius: 1em;
            padding: 1em;
            width: 100%;
        }

        #canvas {
            display: none;
        }

        * {
            box-sizing: border-box;
        }

        #generateBtn {
            z-index: 1;
        }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>
<body>
    <div class="container">
        <h1>ICS Location Image Generator</h1>
        <p>Generate a lock screen image schedule of where you need to go throughout the day</p>
        <input type="file" id="fileInput" accept=".ics">
        <br>
        <input type="date" id="dateInput">
        <br>
        <button id="generateBtn">Generate Image</button>
        <br>
        <canvas id="canvas"></canvas>
        <br>
        <a id="downloadLink" style="display: none;">Download Image</a>
        <zero-md style="margin-top:3em; text-align: left; border-radius: 1em; padding: min(5em, 3vw); background-color: #0d1117;" src="README.md"></zero-md>
    </div>


    <script>
        const fileInput = document.getElementById('fileInput');
        const dateInput = document.getElementById('dateInput');
        const generateBtn = document.getElementById('generateBtn');

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadLink = document.getElementById('downloadLink');

        // Set default date to today
        dateInput.valueAsDate = new Date();

        generateBtn.addEventListener('click', handleGenerate);
        generateBtn.addEventListener("mouseleave", () =>
        {
            generateBtn.innerText = `Generate Image`;
            generateBtn.style.boxShadow = ``;
            generateBtn.style.scale = 1;
        });

        function handleGenerate()
        {
            const file = fileInput.files[0];
            if (!file)
            {
                generateBtn.innerText = `Please select an .ics file.`;
                generateBtn.style.boxShadow = `0 5px 15px 0 rgba(0, 0, 0, 0.348), inset 0 0 0 2px #ff0000`;
                generateBtn.style.scale = parseFloat(generateBtn.style.scale) * 1.1;
                return;
            }

            const selectedDate = new Date(dateInput.value);
            selectedDate.setHours(0, 0, 0, 0);

            const reader = new FileReader();
            reader.onload = function (e)
            {
                const icsData = e.target.result;
                const jcalData = ICAL.parse(icsData);
                const comp = new ICAL.Component(jcalData);
                const vevents = comp.getAllSubcomponents('vevent');

                const eventData = vevents
                    .filter(vevent =>
                    {
                        const eventDate = vevent.getFirstPropertyValue('dtstart').toJSDate();
                        return eventDate.toDateString() === selectedDate.toDateString();
                    })
                    .map(vevent => ({
                        location: vevent.getFirstPropertyValue('location'),
                        startTime: vevent.getFirstPropertyValue('dtstart').toJSDate()
                    }))
                    .filter(event => event.location); // Remove events with undefined or empty locations

                if (eventData.length === 0)
                {
                    alert('No locations found for the selected date in the .ics file.');
                    return;
                }

                // Sort events by start time
                eventData.sort((a, b) => a.startTime - b.startTime);

                const locations = eventData.map(event => event.location);
                generateImage(locations);
            };
            reader.readAsText(file);
        }

        function generateImage(locations)
        {
            const width = 800;
            const height = 800;
            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const maxLocations = Math.min(locations.length, 8);
            const fontSize = Math.min(100, Math.floor(height / maxLocations) - 20);
            ctx.font = `bold ${fontSize}px monospace`;

            const lineHeight = Math.floor(height / maxLocations);
            const startY = lineHeight / 2;

            locations.slice(0, maxLocations).forEach((location, index) =>
            {
                const y = startY + index * lineHeight;
                ctx.fillText(location.toUpperCase(), width / 2, y);
            });

            const dataURL = canvas.toDataURL('image/png');
            downloadLink.href = dataURL;
            downloadLink.download = 'locations.png';
            downloadLink.style.display = 'inline';
            downloadLink.textContent = 'Download Image';
        }
    </script>
</body>
</html>
